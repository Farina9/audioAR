<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Audio Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-modal, #a-scene-container {
      display: none !important;
      visibility: hidden !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, sans-serif;
    }
    #audio-toolbar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tool-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.86);
      color: white;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }
  </style>

  <script>
    let globalMuted = false;
    let globalPaused = false;

    function getAllAudios() {
      return Array.from(document.querySelectorAll("audio"));
    }

    function updateMuteButton() {
      const btn = document.getElementById("btnMute");
      if (btn) btn.textContent = globalMuted ? "🔇 صدا خاموش" : "🔊 صدا روشن";
    }

    function updatePlayButton() {
      const btn = document.getElementById("btnPlayPause");
      if (btn) btn.textContent = globalPaused ? "▶️ ادامه صداها" : "⏸ توقف همه";
    }

    function toggleMute() {
      globalMuted = !globalMuted;
      getAllAudios().forEach(a => a.muted = globalMuted);
      updateMuteButton();
    }

    function togglePlayPause() {
      globalPaused = !globalPaused;
      const audios = getAllAudios();

      if (globalPaused) {
        audios.forEach(a => a.pause());
      } else {
        audios.forEach(a => {
          if (a.dataset.shouldResume === "true") {
            a.play().catch(() => {});
          }
        });
      }
      updatePlayButton();
    }

    AFRAME.registerComponent("ar-audio-controller", {
      schema: {
        audio: { type: "selector" },
        autoPlay: { type: "boolean", default: true },
        stopOnLost: { type: "boolean", default: true },
        loop: { type: "boolean", default: true },
        volume: { type: "number", default: 1 },
        delay: { type: "number", default: 0 }
      },

      init: function () {
        const audio = this.data.audio;
        if (!audio) return;

        audio.loop = this.data.loop;
        audio.volume = Math.max(0, Math.min(1, this.data.volume));
        audio.muted = globalMuted;
        audio.dataset.shouldResume = "false";

        this.playTimeout = null;

        this.el.addEventListener("targetFound", () => {
          audio.dataset.shouldResume = "true";
          if (!this.data.autoPlay || globalPaused) return;

          clearTimeout(this.playTimeout);
          this.playTimeout = setTimeout(() => {
            audio.currentTime = 0;
            audio.muted = globalMuted;
            audio.play().catch(() => {});
          }, this.data.delay * 1000);
        });

        this.el.addEventListener("targetLost", () => {
          clearTimeout(this.playTimeout);
          if (this.data.stopOnLost) {
            audio.pause();
            audio.currentTime = 0;
            audio.dataset.shouldResume = "false";
          } else {
            audio.dataset.shouldResume = "true";
          }
        });
      },

      remove: function () {
        clearTimeout(this.playTimeout);
      }
    });
  </script>
</head>
<body>
  <div id="audio-toolbar">
    <button class="tool-btn" id="btnMute" onclick="toggleMute()">🔊 صدا روشن</button>
    <button class="tool-btn" id="btnPlayPause" onclick="togglePlayPause()">⏸ توقف همه</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets>
    <audio id="audio-0" src="audios/audio1.mp3" preload="auto" crossorigin="anonymous"></audio>
    <audio id="audio-1" src="audios/audio2.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" ar-audio-controller="audio: #audio-0; autoPlay: true; stopOnLost: true; loop: true; volume: 1; delay: 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" ar-audio-controller="audio: #audio-1; autoPlay: true; stopOnLost: true; loop: true; volume: 1; delay: 0"></a-entity>

  </a-scene>
</body>
</html>
